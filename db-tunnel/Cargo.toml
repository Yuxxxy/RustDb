[package]
name = "rustdb-db-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "RustDb SSH 隧道（russh）：known_hosts 校验先于凭据发送"

[dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
thiserror = { workspace = true }
log = { workspace = true }
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
base64 = { workspace = true }

[dev-dependencies]
# 与 russh 使用的版本保持一致；仅测试用于生成随机 ed25519 密钥。
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rand_core", "getrandom"] }
